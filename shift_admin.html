<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>シフト管理（管理者）</title>
<style>
  * { box-sizing:border-box; margin:0; padding:0; }
  :root {
    --green:#2d6a4f; --green-light:#52b788; --green-pale:#d8f3dc;
    --bg:#f8faf8; --text:#1b2e1e; --muted:#6b7c6e;
    --border:#c5d9c7; --white:#ffffff; --red:#c0392b;
    --orange:#e67e22; --blue:#2980b9; --blue-pale:#d6eaf8;
  }
  body { font-family:-apple-system,'Hiragino Sans','Yu Gothic',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; font-size:14px; }
  header { background:var(--green); color:white; padding:14px 16px; display:flex; align-items:center; gap:10px; position:sticky; top:0; z-index:100; box-shadow:0 2px 8px rgba(0,0,0,.15); }
  header .icon { font-size:20px; }
  header .title { flex:1; }
  header .title h1 { font-size:16px; font-weight:700; }
  header .title p { font-size:11px; opacity:.75; margin-top:2px; }
  .nav { display:flex; gap:10px; }
  .nav a { color:rgba(255,255,255,.8); font-size:12px; text-decoration:none; white-space:nowrap; }
  .lock-overlay { display:flex; position:fixed; inset:0; background:var(--bg); z-index:500; flex-direction:column; align-items:center; justify-content:center; padding:24px; }
  .lock-icon { font-size:48px; margin-bottom:16px; }
  .lock-overlay h2 { font-size:18px; font-weight:700; color:var(--green); margin-bottom:6px; }
  .lock-overlay p { font-size:13px; color:var(--muted); margin-bottom:24px; }
  .pin-input { display:flex; gap:10px; margin-bottom:16px; }
  .pin-digit { width:52px; height:60px; border:2px solid var(--border); border-radius:10px; font-size:24px; text-align:center; font-family:monospace; background:var(--white); color:var(--text); }
  .pin-digit:focus { outline:none; border-color:var(--green-light); }
  .pin-error { color:var(--red); font-size:13px; margin-bottom:12px; min-height:20px; }
  .btn-unlock { padding:12px 40px; background:var(--green); color:white; border:none; border-radius:10px; font-size:15px; font-weight:700; cursor:pointer; }
  .container { padding:12px; max-width:1000px; margin:0 auto; }
  .page-tabs { display:flex; gap:0; margin-bottom:14px; border-radius:10px; overflow:hidden; border:1.5px solid var(--border); max-width:360px; }
  .page-tab { flex:1; padding:10px 4px; text-align:center; font-size:13px; font-weight:700; cursor:pointer; background:var(--white); color:var(--muted); border:none; }
  .page-tab.active { background:var(--green); color:white; }
  .page-tab:not(:last-child) { border-right:1.5px solid var(--border); }
  .page { display:none; }
  .page.active { display:block; }
  .top-bar { display:flex; gap:8px; align-items:center; margin-bottom:12px; flex-wrap:wrap; }
  .month-nav { display:flex; align-items:center; gap:8px; }
  .month-nav button { padding:6px 12px; border:1.5px solid var(--border); border-radius:8px; background:var(--white); font-size:14px; cursor:pointer; color:var(--muted); }
  .month-nav button:active { background:var(--green-pale); }
  .month-label { font-size:15px; font-weight:700; color:var(--green); white-space:nowrap; }
  .btn-green { padding:8px 16px; background:var(--green); color:white; border:none; border-radius:8px; font-size:13px; font-weight:700; cursor:pointer; white-space:nowrap; }
  .btn-green:active { opacity:.8; }
  .matrix-wrap { overflow-x:auto; background:var(--white); border-radius:12px; box-shadow:0 1px 4px rgba(0,0,0,.07); }
  .matrix-wrap table { border-collapse:collapse; font-size:12px; }
  .matrix-wrap th, .matrix-wrap td { border:1px solid #f0f4f0; }
  .matrix-wrap thead th { background:var(--green); color:white; padding:7px 10px; text-align:center; white-space:nowrap; position:sticky; top:0; z-index:10; }
  .matrix-wrap thead th:first-child { text-align:left; position:sticky; left:0; z-index:11; }
  .date-th { position:sticky; left:0; background:var(--white); font-weight:700; padding:7px 10px; white-space:nowrap; z-index:5; border-right:2px solid var(--border) !important; font-size:12px; }
  .date-th.sun,.date-th.hol { color:var(--red); }
  .date-th.sat { color:var(--blue); }
  .req-td { width:60px; text-align:center; padding:6px 4px; font-size:14px; }
  .req-td.off-cell { background:#fff0f0; }
  .row-sun { background:#fff5f5; }
  .row-sat { background:#f0f5ff; }
  .row-hol { background:#fff0f5; }
  .today-r { background:#e8f8ef !important; }
  .shift-layout { display:grid; grid-template-columns:1fr 140px; gap:10px; align-items:start; }
  @media(max-width:520px){ .shift-layout { grid-template-columns:1fr; } }
  .shift-grid { border-collapse:collapse; font-size:12px; min-width:100%; }
  .shift-grid th, .shift-grid td { border:1px solid #e8f0e8; padding:0; }
  .shift-grid thead th { background:var(--green); color:white; padding:6px 8px; text-align:center; white-space:nowrap; position:sticky; top:0; z-index:10; font-size:12px; }
  .shift-grid thead th:first-child { left:0; z-index:11; min-width:80px; }
  .shift-grid thead th.course-th { background:#1a5276; }
  .sg-date { position:sticky; left:0; background:var(--white); font-weight:700; padding:5px 8px; white-space:nowrap; z-index:5; border-right:2px solid var(--border) !important; font-size:12px; }
  .sg-date.sun,.sg-date.hol { color:var(--red); }
  .sg-date.sat { color:var(--blue); }
  .sg-row.row-sun { background:#fff5f5; }
  .sg-row.row-sat { background:#f0f5ff; }
  .sg-row.row-hol { background:#fff0f5; }
  .sg-row.today-r { background:#e8f8ef !important; }
  .staff-cell { width:52px; min-width:52px; height:38px; text-align:center; cursor:pointer; vertical-align:middle; }
  .staff-cell.is-off { background:#f5f5f5; }
  .staff-cell.is-work { background:#d5f5e3; }
  .cell-icon { font-size:15px; }
  .course-cell-g { min-width:80px; padding:3px 5px; vertical-align:middle; cursor:pointer; }
  .course-cell-g.drag-over { background:var(--green-pale); }
  .course-palette { background:var(--white); border-radius:12px; padding:10px; box-shadow:0 1px 4px rgba(0,0,0,.07); position:sticky; top:70px; }
  .palette-title { font-size:11px; font-weight:700; color:var(--muted); margin-bottom:8px; }
  .palette-item { padding:7px 8px; border-radius:8px; font-size:12px; font-weight:700; cursor:grab; margin-bottom:5px; user-select:none; text-align:center; }
  .palette-item:active { opacity:.7; }
  .palette-item.selected { outline:3px solid var(--green); }
  .course-tag { display:inline-flex; align-items:center; gap:3px; padding:3px 7px; border-radius:7px; font-size:11px; font-weight:700; user-select:none; }
  .course-tag .rm { font-size:13px; line-height:1; color:rgba(0,0,0,.4); cursor:pointer; }
  .course-tag .rm:hover { color:var(--red); }
  .staff-sort-wrap { background:var(--white); border-radius:12px; padding:10px 12px; margin-bottom:10px; box-shadow:0 1px 4px rgba(0,0,0,.07); display:none; }
  .staff-sort-title { font-size:12px; font-weight:700; color:var(--green); margin-bottom:8px; }
  .staff-sort-list { display:flex; gap:6px; flex-wrap:wrap; }
  .staff-sort-item { display:flex; align-items:center; gap:4px; padding:5px 10px; background:var(--green-pale); border:1.5px solid var(--green-light); border-radius:8px; font-size:12px; font-weight:700; color:var(--green); cursor:grab; user-select:none; }
  .staff-sort-item.dragging { opacity:.4; }
  .staff-sort-item .handle { color:var(--muted); }
  .c0{background:#d5f5e3;color:#1e8449;} .c1{background:#d6eaf8;color:#1a5276;}
  .c2{background:#fde8e8;color:#922b21;} .c3{background:#fef3cd;color:#7d6608;}
  .c4{background:#e8daef;color:#6c3483;} .c5{background:#fdebd0;color:#784212;}
  .c6{background:#d5d8dc;color:#2c3e50;} .c7{background:#d1f2eb;color:#0e6655;}
  .save-banner { position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:var(--green); color:white; padding:11px 26px; border-radius:30px; font-size:14px; font-weight:700; box-shadow:0 4px 16px rgba(0,0,0,.2); opacity:0; transition:opacity .3s; pointer-events:none; white-space:nowrap; z-index:999; }
  .save-banner.show { opacity:1; }
  .loading { text-align:center; padding:24px; color:var(--muted); }
  .spinner { display:inline-block; width:20px; height:20px; border:3px solid var(--border); border-top-color:var(--green); border-radius:50%; animation:spin .8s linear infinite; vertical-align:middle; margin-right:6px; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .empty { text-align:center; padding:24px; color:var(--muted); font-size:13px; }
  footer { text-align:center; padding:20px 16px; font-size:11px; color:var(--muted); border-top:1px solid var(--border); margin-top:20px; }
</style>

<script>
// ===== 全関数をheadで定義 =====
const SUPABASE_URL='https://kcgycrzqmjdfxctmllaf.supabase.co';
const SUPABASE_KEY='sb_publishable_gIG_84rtMPMZCAsnStcj4w_yKYdJWCm';
const SB_H={'Content-Type':'application/json','apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY};
const PIN='1121', SESSION_KEY='admin_menu_unlocked';
const DAYS=['日','月','火','水','木','金','土'];
const COLORS=['c0','c1','c2','c3','c4','c5','c6','c7'];
const HOLIDAYS=new Set(['2026-01-01','2026-01-12','2026-02-11','2026-02-23','2026-03-20','2026-04-29','2026-05-03','2026-05-04','2026-05-05','2026-05-06','2026-07-20','2026-08-11','2026-09-21','2026-09-22','2026-09-23','2026-10-12','2026-11-03','2026-11-23','2026-12-23']);
const STAFF_ORDER_KEY='shift_staff_order';

let year=new Date().getFullYear(), month=new Date().getMonth()+1;
let year2=new Date().getFullYear(), month2=new Date().getMonth()+1;
let courses=[], shiftMap={}, allReqMap={}, staffList=[];
let shiftStaff=[], shiftStaffMap={};
let dragCourse=null, selectedPalette=null, dragStaffIdx=null;

function pad(n){return String(n).padStart(2,'0');}
function lastDay(y,m){return new Date(y,m,0).getDate();}
function colorOf(i){return COLORS[i%COLORS.length];}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function isHol(ds){return HOLIDAYS.has(ds);}
function todayStr(){const n=new Date();return `${n.getFullYear()}-${pad(n.getMonth()+1)}-${pad(n.getDate())}`;}
function showBanner(){const b=document.getElementById('saveBanner');b.classList.add('show');setTimeout(()=>b.classList.remove('show'),2000);}

async function sbGet(t,q=''){const r=await fetch(`${SUPABASE_URL}/rest/v1/${t}${q}`,{headers:SB_H});return r.json();}
async function sbInsert(t,d){const r=await fetch(`${SUPABASE_URL}/rest/v1/${t}`,{method:'POST',headers:{...SB_H,'Prefer':'return=minimal'},body:JSON.stringify(d)});return r.ok;}
async function sbDelete(t,q){const r=await fetch(`${SUPABASE_URL}/rest/v1/${t}${q}`,{method:'DELETE',headers:SB_H});return r.ok;}

// PIN
function onPin(idx){
  const el=document.getElementById('p'+idx);
  const val=el.value;
  if(val&&idx<3)document.getElementById('p'+(idx+1)).focus();
  if(idx===3&&val)checkPin();
}
function checkPin(){
  const pin=[0,1,2,3].map(i=>document.getElementById('p'+i).value).join('');
  if(pin===PIN){
    sessionStorage.setItem(SESSION_KEY,'true');
    document.getElementById('lockOverlay').style.display='none';
    init();
  } else {
    document.getElementById('pinError').textContent='PINが正しくありません';
    [0,1,2,3].forEach(i=>{document.getElementById('p'+i).value='';});
    document.getElementById('p0').focus();
    setTimeout(()=>{document.getElementById('pinError').textContent='';},2000);
  }
}

// タブ
function switchPage(name,el){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.page-tab').forEach(t=>t.classList.remove('active'));
  document.getElementById('page-'+name).classList.add('active');
  el.classList.add('active');
  if(name==='req')loadReqMatrix();
  if(name==='shift')loadShiftData();
}

// 月移動
function prevMonth(){month--;if(month<1){month=12;year--;}updateLabels();loadReqMatrix();}
function nextMonth(){month++;if(month>12){month=1;year++;}updateLabels();loadReqMatrix();}
function prevMonth2(){month2--;if(month2<1){month2=12;year2--;}updateLabels();loadShiftData();}
function nextMonth2(){month2++;if(month2>12){month2=1;year2++;}updateLabels();loadShiftData();}
function updateLabels(){
  document.getElementById('monthLabel1').textContent=year+'年'+month+'月';
  document.getElementById('monthLabel2').textContent=year2+'年'+month2+'月';
}

// 並び順
async function saveStaffOrder(){
  await fetch(`${SUPABASE_URL}/rest/v1/settings`,{method:'POST',headers:{...SB_H,'Prefer':'resolution=merge-duplicates,return=minimal'},body:JSON.stringify({key:STAFF_ORDER_KEY,value:JSON.stringify(shiftStaff)})});
  localStorage.setItem(STAFF_ORDER_KEY,JSON.stringify(shiftStaff));
}
async function loadStaffOrder(){
  try{const r=await fetch(`${SUPABASE_URL}/rest/v1/settings?key=eq.${STAFF_ORDER_KEY}`,{headers:SB_H});const rows=await r.json();if(rows.length)localStorage.setItem(STAFF_ORDER_KEY,rows[0].value);}catch(e){}
}
function applyStaffOrder(rawList){
  const saved=localStorage.getItem(STAFF_ORDER_KEY);
  if(!saved)return rawList;
  try{const order=JSON.parse(saved);const ordered=order.filter(s=>rawList.includes(s));rawList.forEach(s=>{if(!ordered.includes(s))ordered.push(s);});return ordered;}
  catch(e){return rawList;}
}
function renderStaffSort(){
  const wrap=document.getElementById('staffSortWrap');
  const list=document.getElementById('staffSortList');
  if(!shiftStaff.length){wrap.style.display='none';return;}
  wrap.style.display='block';
  list.innerHTML=shiftStaff.map((s,i)=>
    `<div class="staff-sort-item" draggable="true"
      ondragstart="dragStaffIdx=${i};this.classList.add('dragging')"
      ondragend="this.classList.remove('dragging')"
      ondragover="event.preventDefault()"
      ondrop="onStaffDrop(event,${i})"
    ><span class="handle">⠿</span>${esc(s)}</div>`
  ).join('');
}
function onStaffDrop(event,toIdx){
  event.preventDefault();
  if(dragStaffIdx===null||dragStaffIdx===toIdx)return;
  const moved=shiftStaff.splice(dragStaffIdx,1)[0];
  shiftStaff.splice(toIdx,0,moved);
  dragStaffIdx=null;
  saveStaffOrder();
  renderStaffSort();
  renderShiftTable();
}

// 休み希望一覧
async function loadReqMatrix(){
  document.getElementById('reqArea').innerHTML='<div class="loading"><span class="spinner"></span>読み込み中…</div>';
  const from=`${year}-${pad(month)}-01`;
  const to=`${year}-${pad(month)}-${pad(lastDay(year,month))}`;
  const rows=await sbGet('shift_requests',`?work_date=gte.${from}&work_date=lte.${to}&order=staff_name.asc,work_date.asc`);
  if(!rows.length){document.getElementById('reqArea').innerHTML='<div class="empty">希望入力がありません</div>';return;}
  staffList=[...new Set(rows.map(r=>r.staff_name))].sort();
  const mat={};
  rows.forEach(r=>{if(!mat[r.staff_name])mat[r.staff_name]={};mat[r.staff_name][r.work_date]=r.request_type;});
  const total=lastDay(year,month);
  const today=todayStr();
  let html='<div class="matrix-wrap"><table><thead><tr><th style="min-width:80px;text-align:left;padding:7px 10px">日付</th><th style="background:#1e5c3a;min-width:50px">出勤可</th>'+staffList.map(s=>`<th>${esc(s)}</th>`).join('')+'</tr></thead><tbody>';
  for(let d=1;d<=total;d++){
    const ds=`${year}-${pad(month)}-${pad(d)}`;
    const dow=new Date(year,month-1,d).getDay();
    const hol=isHol(ds);
    const dateCls=(hol?'hol':dow===0?'sun':dow===6?'sat':'')+(ds===today?' today-r':'');
    const rowBg=hol||dow===0?'background:#fff5f5':dow===6?'background:#f0f5ff':'';
    const offCount=staffList.filter(s=>mat[s]?.[ds]==='休み希望').length;
    const avail=staffList.length-offCount;
    html+=`<tr style="${rowBg}"><td class="date-th ${dateCls}">${d}（${DAYS[dow]}）${hol?'<span style="color:var(--red);font-size:9px"> 祝</span>':''}</td><td class="req-td" style="font-weight:700;color:${avail<=1?'var(--red)':'var(--green)'}">${avail}</td>${staffList.map(s=>{const isOff=mat[s]?.[ds]==='休み希望';return `<td class="req-td${isOff?' off-cell':''}">${isOff?'❌':''}</td>`;}).join('')}</tr>`;
  }
  html+='</tbody></table></div>';
  document.getElementById('reqArea').innerHTML=html;
}

// コースパレット
function renderPalette(){
  const countMap={};
  Object.values(shiftMap).forEach(list=>{list.forEach(cv=>{countMap[cv.courseCode]=(countMap[cv.courseCode]||0)+1;});});
  document.getElementById('paletteItems').innerHTML=courses.map((c,i)=>{
    const cnt=countMap[c.code]||0;
    return `<div class="palette-item ${colorOf(i)}" draggable="true" id="pal-${i}"
      ondragstart="onDragStart(event,'${esc(c.code)}','${esc(c.name)}',${i})"
      onclick="onPaletteClick(event,'${esc(c.code)}','${esc(c.name)}',${i})"
    >${esc(c.name)}<span style="display:block;font-size:10px;font-weight:400;margin-top:2px">${cnt}件</span></div>`;
  }).join('');
}
function onDragStart(e,code,name,idx){dragCourse={code,name,idx};selectedPalette=null;e.dataTransfer.effectAllowed='copy';}
function onPaletteClick(e,code,name,idx){
  selectedPalette={code,name,idx};
  document.querySelectorAll('.palette-item').forEach(el=>el.classList.remove('selected'));
  document.getElementById('pal-'+idx).classList.add('selected');
}

// シフト読み込み
async function loadShiftData(){
  document.getElementById('shiftTable').innerHTML='<div class="loading"><span class="spinner"></span>読み込み中…</div>';
  const from=`${year2}-${pad(month2)}-01`;
  const to=`${year2}-${pad(month2)}-${pad(lastDay(year2,month2))}`;
  const [reqs,shifts]=await Promise.all([
    sbGet('shift_requests',`?work_date=gte.${from}&work_date=lte.${to}&order=staff_name.asc`),
    sbGet('shifts',`?work_date=gte.${from}&work_date=lte.${to}&order=work_date.asc`)
  ]);
  const rawStaff=[...new Set(reqs.map(r=>r.staff_name).filter(Boolean))].sort();
  shiftStaff=applyStaffOrder(rawStaff);
  allReqMap={};
  reqs.forEach(r=>{if(r.request_type==='休み希望'){if(!allReqMap[r.work_date])allReqMap[r.work_date]=[];allReqMap[r.work_date].push(r.staff_name);}});
  shiftMap={};shiftStaffMap={};
  shifts.forEach(r=>{
    if(r.course_code==='__work__'&&r.staff_name){if(!shiftStaffMap[r.work_date])shiftStaffMap[r.work_date]={};shiftStaffMap[r.work_date][r.staff_name]='work';}
    else{if(!shiftMap[r.work_date])shiftMap[r.work_date]=[];const idx=courses.findIndex(cv=>cv.code===r.course_code);shiftMap[r.work_date].push({courseCode:r.course_code,courseName:r.course_name||r.course_code,colorIdx:idx>=0?idx:0,note:r.note||''});}
  });
  renderStaffSort();
  renderShiftTable();
}

// シフトテーブル描画
function renderShiftTable(){
  if(!shiftStaff.length){document.getElementById('shiftTable').innerHTML='<div class="empty">スタッフの希望データがありません</div>';return;}
  const total=lastDay(year2,month2);
  const today=todayStr();
  let html=`<table class="shift-grid"><thead><tr><th>日付</th>${shiftStaff.map(s=>`<th>${esc(s)}</th>`).join('')}<th style="background:#5d7a94;min-width:44px">出勤可</th><th class="course-th">コース</th></tr></thead><tbody>`;
  for(let d=1;d<=total;d++){
    const ds=`${year2}-${pad(month2)}-${pad(d)}`;
    const dow=new Date(year2,month2-1,d).getDay();
    const hol=isHol(ds);
    const rowCls=(ds===today?'today-r ':(hol?'row-hol ':dow===0?'row-sun ':dow===6?'row-sat ':'')).trim();
    const dateCls=hol?'hol':dow===0?'sun':dow===6?'sat':'';
    const tags=(shiftMap[ds]||[]).map((cv,ci)=>`<span class="course-tag ${colorOf(cv.colorIdx)}">${esc(cv.courseName)}<span class="rm" onclick="removeTag('${esc(ds)}',${ci})">×</span></span>`).join('');
    const workCount=shiftStaff.filter(s=>shiftStaffMap[ds]?.[s]==='work').length;
    html+=`<tr class="sg-row ${rowCls}"><td class="sg-date ${dateCls}">${d}（${DAYS[dow]}）${hol?'<span style="color:var(--red);font-size:9px"> 祝</span>':''}</td>${shiftStaff.map(s=>{const isOff=(allReqMap[ds]||[]).includes(s);const isWork=shiftStaffMap[ds]?.[s]==='work';return `<td class="staff-cell${isWork?' is-work':isOff?' is-off':''}" onclick="toggleWork('${esc(ds)}','${esc(s)}')" ><span class="cell-icon">${isWork?'⭕':isOff?'<span style="color:#555">✕</span>':''}</span></td>`;}).join('')}<td style="text-align:center;font-weight:700;font-size:13px;color:var(--green);vertical-align:middle;min-width:44px">${workCount}</td><td class="course-cell-g" id="sc-${ds}" ondragover="onDragOver(event,'${esc(ds)}')" ondragleave="onDragLeave(event,'${esc(ds)}')" ondrop="onDrop(event,'${esc(ds)}')" onclick="onCellClick('${esc(ds)}')">${tags}</td></tr>`;
  }
  // フッター
  const totalDays=lastDay(year2,month2);
  html+=`<tfoot><tr style="background:var(--green-pale);font-weight:700"><td style="padding:7px 10px;font-size:12px;color:var(--green);position:sticky;left:0;background:var(--green-pale)">出勤日数</td>${shiftStaff.map(s=>{let cnt=0;for(let dd=1;dd<=totalDays;dd++){const ds3=year2+'-'+pad(month2)+'-'+pad(dd);if(shiftStaffMap[ds3]?.[s]==='work')cnt++;}return `<td style="text-align:center;font-size:13px;color:var(--green)">${cnt}</td>`;}).join('')}<td></td><td></td></tr></tfoot>`;
  html+=`</tbody></table>`;
  document.getElementById('shiftTable').innerHTML=html;
  renderPalette();
}

function toggleWork(ds,staff){
  if(!shiftStaffMap[ds])shiftStaffMap[ds]={};
  shiftStaffMap[ds][staff]=shiftStaffMap[ds][staff]==='work'?null:'work';
  renderShiftTable();
}
function onDragOver(e,ds){e.preventDefault();document.getElementById('sc-'+ds).classList.add('drag-over');}
function onDragLeave(e,ds){document.getElementById('sc-'+ds).classList.remove('drag-over');}
function onDrop(e,ds){e.preventDefault();document.getElementById('sc-'+ds).classList.remove('drag-over');if(!dragCourse)return;addCourse(ds,dragCourse.code,dragCourse.name,dragCourse.idx);dragCourse=null;}
function onCellClick(ds){if(!selectedPalette)return;addCourse(ds,selectedPalette.code,selectedPalette.name,selectedPalette.idx);}
function addCourse(ds,code,name,idx){if(!shiftMap[ds])shiftMap[ds]=[];shiftMap[ds].push({courseCode:code,courseName:name,colorIdx:idx,note:''});renderShiftTable();}
function removeTag(ds,ci){if(shiftMap[ds])shiftMap[ds].splice(ci,1);renderShiftTable();}

async function saveShifts(){
  const from=`${year2}-${pad(month2)}-01`;
  const to=`${year2}-${pad(month2)}-${pad(lastDay(year2,month2))}`;
  await sbDelete('shifts',`?work_date=gte.${from}&work_date=lte.${to}`);
  const rows=[];
  Object.entries(shiftMap).forEach(([ds,list])=>{list.forEach(cv=>rows.push({work_date:ds,course_code:cv.courseCode,course_name:cv.courseName,note:cv.note,staff_name:null}));});
  Object.entries(shiftStaffMap).forEach(([ds,obj])=>{Object.entries(obj).forEach(([staff,val])=>{if(val==='work')rows.push({work_date:ds,course_code:'__work__',course_name:'出勤',staff_name:staff,note:''});});});
  if(rows.length)await sbInsert('shifts',rows);
  showBanner();
}

async function init(){
  updateLabels();
  courses=await sbGet('courses','?order=sort_order.asc,code.asc');
  renderPalette();
  await loadStaffOrder();
  await loadReqMatrix();
  await loadShiftData();
}

window.addEventListener('DOMContentLoaded',function(){
  document.addEventListener('keydown',function(e){if(e.key==='Enter'&&sessionStorage.getItem(SESSION_KEY)!=='true')checkPin();});
  if(sessionStorage.getItem(SESSION_KEY)==='true'){
    document.getElementById('lockOverlay').style.display='none';
    init();
  } else {
    setTimeout(function(){ document.getElementById('p0').focus(); }, 100);
  }
});
</script>
